name: Build and publish RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "assets/**"
      - "scripts/**"
      - "test/**"
      - "config/**"
      - "docs/**"
      - "templates/**"
      - ".codex/skills/**"
      - "feed.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-rss.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check article visuals and media budget
        run: npm run visual-check
      - name: Check changed article style
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          STYLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run style-check -- --base "$STYLE_BASE_SHA"
      - name: Build RSS
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
