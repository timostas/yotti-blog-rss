name: Article review report

on:
  schedule:
    - cron: "15 6 * * *"
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "scripts/check-reviews.mjs"
      - "scripts/build-feed.mjs"
      - "test/review-report.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/review-report.yml"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Add review report to summary
        run: node scripts/check-reviews.mjs >> "$GITHUB_STEP_SUMMARY"
